name: Commit Monitor

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping GitHub monitor
        # /api/check-github is implemented by the Vercel functions only.
        run: 'curl -fsS "https://www.mohammadumarportfoloi.online/api/check-github" -H "x-monitor-token: ${{ secrets.MONITOR_TOKEN }}"'
