<!DOCTYPE html>

    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong palette.
      (function () {
        try {
          var stored = window.localStorage.getItem("mu-theme");
          document.documentElement.dataset.theme = stored === "light" || stored === "dark" ? stored : "dark";
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>

    <link rel="canonical" href="https://mohammadumar.site/" />
